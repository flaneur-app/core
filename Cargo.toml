[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/flaneur-app/core"
rust-version = "1.100"
publish = false

[workspace.dependencies]
flaneur-model = { path = "crates/flaneur-model" }
flaneur-connector = { path = "crates/flaneur-connector" }

async-trait = "0.1.92"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"
url = { version = "2.5.9", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
